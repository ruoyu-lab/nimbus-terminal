[package]
name = "nimbus-terminal"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
description = "用 Aureole 框架写的终端：自研 pty 和 xterm 仿真，屏幕用框架的字符网格画"
repository = "https://github.com/ruoyu-lab/nimbus-terminal"
homepage = "https://github.com/ruoyu-lab/nimbus-terminal"
readme = "README.md"
license = "MIT"
keywords = ["terminal", "terminal-emulator", "gui", "macos", "rust"]
categories = ["command-line-utilities", "gui"]
exclude = ["/docs", "/assets/icon.icns", "/.github"]

# 打包设置，框架的打包工具读（Windows：scripts/bundle-windows.ps1）。macOS 的 .app 由 scripts/bundle-macos.sh 做，不读这里，
# 包标识符要和它里面的一样。Windows 上编译脚本（build.rs）也读 identifier，编进可执行文件当应用标识
[package.metadata.bundle]
name = "Nimbus"
identifier = "com.ruoyu-lab.nimbus"
category = "developer-tools"
# macOS 的图标四周留着系统规定的边，放在 Windows 的任务栏上显小：这张裁掉了大部分边
icon = "assets/icon-windows.png"

[dependencies]
# 只用公开 API，不改框架。现在用的是私有仓库 master 上的提交（带 Windows 上改大小、标题栏、输入、材质的改进），
# 框架出了带这些的公开版本以后换回公开的
aureole = { git = "https://github.com/ruoyu-lab/aureole-framework.git", rev = "7f997ec" }
# 字宽（汉字、emoji 两格）：和框架用同一版
unicode-width = "0.2"
# 设置、文件夹、窗口位置的落盘（JSON）
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# 离屏测试：`Harness` 挂视图、模拟点击和移动，不用 GPU 和窗口
aureole = { git = "https://github.com/ruoyu-lab/aureole-framework.git", rev = "7f997ec", features = ["testing"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "deny"

# 和框架一样：wgpu 在未优化的依赖下非常慢，开发时也把依赖编成 release
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "fat"
# 发布的版本去掉符号表：体积小一半以上。崩溃时的调用栈看不到函数名了，原因（panic 信息）还是会写进 crash.log
strip = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# ConPTY、起子进程、问子进程（当前目录、下面有没有程序在跑）、列显示器。和框架依赖树里的是同一版，
# 用到的特性框架也都开着，不会让它多编一遍
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSView", "NSResponder", "NSWindow", "NSApplication", "NSScreen", "NSImage"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSDictionary", "NSString", "NSValue", "NSGeometry"] }
