<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#303548"/>
      <stop offset="1" stop-color="#14161d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#7aa2ff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#7aa2ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#e8f0ff"/>
      <stop offset="0.5" stop-color="#9dbbff"/>
      <stop offset="1" stop-color="#5d86f2"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="clip"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>
  <!-- 圆角方块：macOS 图标的标准留边（100）和圆角 -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#body)"/>
  <g clip-path="url(#clip)">
    <circle cx="512" cy="512" r="400" fill="url(#glow)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
  </g>
  <!-- 光环 -->
  <circle cx="512" cy="512" r="262" fill="none" stroke="#7aa2ff" stroke-width="44" opacity="0.55" filter="url(#soft)"/>
  <circle cx="512" cy="512" r="262" fill="none" stroke="url(#ring)" stroke-width="34"/>
  <!-- 提示符 -->
  <path d="M424 432 L528 512 L424 592" fill="none" stroke="#ffffff" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M566 598 H650" fill="none" stroke="#ffffff" stroke-width="54" stroke-linecap="round"/>
</svg>
